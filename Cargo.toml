[package]
name = "proto_rs"
version = "0.12.0"
authors.workspace = true
edition.workspace = true
description = "Rust-first gRPC macros collection for .proto/protobufs managment and more"
documentation = "https://docs.rs/proto_rs"
readme = "README.md"
homepage.workspace = true
repository.workspace = true
license.workspace = true
keywords.workspace = true
categories.workspace = true

[package.metadata.docs.rs]
all-features = true

[workspace]
resolver = "3"
exclude = ["vendor/h2", "vendor/hyper", "vendor/tonic"]
members = [
  "benches/bench_runner",
  "crates/prosto_derive",
  "tests/proto_build_test",
  "tests/proto_rs_test",
  "tests/tonic_prost_test",
]

[workspace.package]
authors = ["Ivan Auwers <vonauwers@gmail.com>"]
edition = "2024"
description = "Rust-first gRPC macros collection for .proto/protobufs managment and more"
readme = "README.md"
homepage = "https://github.com/4r33x/proto_rs"
repository = "https://github.com/4r33x/proto_rs"
license = "MIT OR Apache-2.0"
keywords = ["grpc", "prost", "proto", "protobufs", "tonic"]
categories = [
  "development-tools",
  "development-tools::build-utils",
  "network-programming",
  "rust-patterns",
]

[workspace.dependencies]
bytes = { version = "1.12", default-features = false }
chrono = "0.4"
criterion = { version = "0.8" }
inventory = { version = "0.3" }
prost = { version = "0.14.4", default-features = false }
prosto_derive = { path = "crates/prosto_derive", version = "0.12.0" }
proto_rs = { path = "./", version = "0.12.0" }
tonic = { version = "0.14.6", default-features = false }


[workspace.lints.clippy]
# cargo = { level = "deny", priority = -1 }
complexity = { level = "deny", priority = -1 }
correctness = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
perf = { level = "deny", priority = -1 }
# restriction = { level = "warn", priority = -1 }
style = { level = "deny", priority = -1 }

[workspace.lints.rust]
unsafe_code = { level = "forbid", priority = 0 }

# Tonic/tonic-prost must share one type identity. Downstream workspace roots
# must carry this patch as well; Cargo does not inherit dependency patches.
[patch.crates-io]
tonic = { path = "vendor/tonic" }


[[bench]]
harness = false
name = "varint"

[[bench]]
harness = false
name = "encode_pool"

[[bench]]
harness = false
name = "tonic_encode"
required-features = ["tonic"]

[[bench]]
harness = false
name = "bytes_pipeline"
required-features = ["tonic-transport"]

[[example]]
name = "zerocopy_transfer"
required-features = ["linux-zerocopy"]

[[bench]]
harness = false
name = "zerocopy_channel"
required-features = ["linux-zerocopy"]

[dependencies]
flate2 = { version = "1.1", default-features = false, features = ["zlib-rs"], optional = true }
ahash = { version = "0.8.12", optional = true }
arc-swap = { version = "1.9", optional = true }
bytes.workspace = true
chrono = { workspace = true, optional = true }
const_panic = { version = "0.2.15", features = [
  "derive",
  "rust_latest_stable",
] }
crossbeam-utils = "0.8"
fastnum = { version = "0.7.5", optional = true }
futures-core = "0.3"
http = "1"
inventory = { workspace = true, optional = true }
papaya = { version = "0.2.4", optional = true }
parking_lot = { version = "0.12", optional = true }
pin-project-lite = "0.2"
prosto_derive.workspace = true
solana-address = { version = "2", optional = true }
solana-hash = { version = "4", optional = true }
solana-instruction = { version = "4", optional = true }
solana-instruction-error = { version = "3", optional = true }
solana-keypair = { version = "4", optional = true }
solana-signature = { version = "3", optional = true }
solana-transaction-error = { version = "4", optional = true }
tokio-stream = { version = "0.1", optional = true }

teloxide-core = { version = "0.13", optional = true, default-features = false }
tonic = { workspace = true, optional = true }
tracing = { version = "0.1", optional = true }
tokio = { version = "1.52", features = ["net", "rt", "sync", "io-util", "time"], optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
hyper-zerocopy = { package = "proto-rs-hyper", path = "vendor/hyper", version = "1.11.0-proto.1", default-features = false, features = ["client", "server", "http2"], optional = true }
hyper-util = { version = "0.1", features = ["client-legacy", "tokio"], optional = true }
libc = { version = "0.2", optional = true }


[dev-dependencies]
criterion.workspace = true
proptest = "1.11"
prost.workspace = true
rand = "0.10"
tonic = { workspace = true, features = ["gzip", "tls-ring"] }
tonic-prost = "0.14.6"
rcgen = "0.14"

tokio = { version = "1.52", features = ["full"] }
tokio-stream = { version = "0.1", features = ["net"] }

chrono.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tonic_prost_test = { path = "tests/tonic_prost_test" }

[features]
tonic = ["bytes/std", "dep:tonic", "tonic/codegen", "prosto_derive/tonic"]
# Requires the vendored Tonic extension; plain `tonic` uses upstream's buffered codec.
tonic-owned = ["tonic", "tonic/proto-rs-owned"]
tonic-transport = ["tonic", "tonic/transport", "prosto_derive/tonic-transport", "dep:tracing", "dep:tokio"]
# Opt-in faster gzip backend, shared with Tonic through Cargo feature unification.
tonic-gzip = ["tonic", "tonic/gzip", "dep:flate2"]
# Isolated owned-buffer HTTP/2 fork and Linux MSG_ZEROCOPY transport.
linux-zerocopy = ["tonic-owned", "tonic-transport", "dep:hyper-zerocopy", "dep:hyper-util", "dep:libc", "dep:tokio"]

ahash = ["dep:ahash"]
block_razor = ["dep:tokio-stream", "tonic"]
bloxroute = ["tonic"]
cache_padded = []
fastnum = ["dep:fastnum"]
jito = ["dep:tokio-stream", "tonic"]
next_block = ["tonic"]
solana = [
  "dep:solana-address",
  "dep:solana-hash",
  "dep:solana-instruction",
  "dep:solana-instruction-error",
  "dep:solana-keypair",
  "dep:solana-signature",
  "dep:solana-transaction-error",
]
solana_address_hash = ["solana", "solana-address/rand"]
std_legacy = []
teloxide = ["dep:teloxide-core"]


# Lock-free atomic Arc wrappers
arc_swap = ["dep:arc-swap"]
# Schema collection for build scripts
build-schemas = ["inventory"]
chrono = ["dep:chrono"]
# Concurrent papaya collections
papaya = ["dep:papaya"]
# Mutex wrappers backed by parking_lot
parking_lot = ["dep:parking_lot"]

# Compile on the stable toolchain
stable = ["prosto_derive/stable"]

default = ["tonic-owned", "tonic-transport"]
no-recursion-limit = []
# derive = ["dep:prost-derive"]

# [lints.rust]
# unsafe_code = { level = "forbid", priority = 0 }

[lints.clippy]
unused_async_trait_impl = "allow"
await_holding_lock = "deny"
# cargo = { level = "deny", priority = -1 }
complexity = { level = "deny", priority = -1 }
correctness = { level = "deny", priority = -1 }
missing_const_for_fn = "warn"
pedantic = { level = "deny", priority = -1 }
perf = { level = "deny", priority = -1 }
# restriction = { level = "warn", priority = -1 }
style = { level = "deny", priority = -1 }
too_many_arguments = "allow"
trivially_copy_pass_by_ref = "warn"
unused_async = "deny"

[profile.bench]
opt-level = 3
# use thin here to improve compile time
lto = "fat"
incremental = false
codegen-units = 1
